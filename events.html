* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --dark: #0E0E0E; --gold: #B09060; --cream: #F4EFE6;
    --warm: #FAF7F2; --red: #8B1A2A; --red-light: #fdf2f3;

body { font-family: 'Noto Sans KR', sans-serif; background: #fff; color: var(--dark); }

/* ─── Nav ─── */
nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem; height: 60px;
    background: rgba(14,14,14,0.97); backdrop-filter: blur(8px);

.nav-logo { font-family: 'Noto Serif KR', serif; color: #fff; font-size: 1rem; font-weight: 600; text-decoration: none; }
.nav-center { display: flex; gap: 2rem; list-style: none; }
.nav-center a { color: #ccc; text-decoration: none; font-size: 0.88rem; transition: color 0.2s; }
.nav-center a:hover, .nav-center a.active { color: #fff; }
.hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
.hamburger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }
.mobile-menu {
    display: none; flex-direction: column;
    position: fixed; top: 60px; left: 0; right: 0; z-index: 99;
    background: rgba(14,14,14,0.97); padding: 1rem 0;
}
.mobile-menu.open { display: flex; }
.mobile-menu a { color: #ccc; text-decoration: none; padding: 0.85rem 2rem; font-size: 0.95rem; border-bottom: 1px solid #222; }
.mobile-menu a:hover { color: #fff; background: #1a1a1a; }

/* ─── Page Header ─── */
.page-header {
    margin-top: 60px; padding: 3rem 2rem 2rem;
    text-align: center; background: var(--dark); color: #fff;
}
.page-header h1 { font-family: 'Noto Serif KR', serif; font-size: 2.2rem; font-weight: 600; letter-spacing: 0.15em; }
.page-header p { color: #aaa; margin-top: 0.5rem; font-size: 0.9rem; }

/* ─── Category Tabs ─── */
.cat-wrap {
    position: sticky; top: 60px; z-index: 50;
    background: #fff; border-bottom: 2px solid var(--border);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.cat-wrap::-webkit-scrollbar { display: none; }
.cat-tabs { display: flex; min-width: max-content; padding: 0 1.5rem; width: 100%; justify-content: center; }
.cat-tab {
    padding: 1rem 1.4rem; font-size: 0.9rem; font-weight: 500;
    color: var(--muted); border: none; background: none; cursor: pointer;
    border-bottom: 3px solid transparent; white-space: nowrap;
    transition: all 0.2s; margin-bottom: -2px;
}
.cat-tab:hover { color: var(--dark); }
.cat-tab.active { color: var(--red); border-bottom-color: var(--red); font-weight: 700; }

/* ─── Content Area ─── */
.content-area { max-width: 1080px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

/* ─── 이달의 이벤트 — 빨간 계열 ─── */
.events-table { width: 100%; border-top: 2px solid var(--dark); }
.event-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.3rem 0; border-bottom: 1px solid rgba(0,0,0,0.1);
    gap: 2rem; transition: all 0.18s; cursor: default;
}
.event-row:hover { background: var(--red-light); padding-left: 1.4rem; padding-right: 1.4rem; margin: 0 -1.4rem; }
.event-row-left { flex: 1; min-width: 0; }
.event-row-name { font-family: 'Noto Serif KR', serif; font-size: clamp(1.1rem, 2vw, 1.45rem); font-weight: 600; color: var(--dark); line-height: 1.25; }
.event-row-period { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em; color: var(--mid); margin-top: 0.5rem; }
.event-row-right { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.price-original { font-size: 0.88rem; color: var(--silver); text-decoration: line-through; }
.price-arrow { color: var(--silver); font-size: 0.85rem; }
.price-event { font-family: 'Noto Serif KR', serif; font-size: clamp(1.6rem, 2.8vw, 2.2rem); font-weight: 700; color: var(--red); }
.vat-badge { font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 2px; letter-spacing: 0.04em; border: 1px solid; }
.vat-badge.incl { color: #1a7a3f; border-color: #1a7a3f; background: #f0faf4; }
.vat-badge.excl { color: var(--muted); border-color: var(--silver); background: transparent; }
.price-badge { background: var(--red); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 2px; letter-spacing: 0.04em; }

/* ─── 프로그램 카드 그리드 ─── */
.program-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6rem; }
.program-card {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;

.card-img img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.3s; }

.card-img-placeholder {

.card-img-placeholder p { font-size: 0.72rem; }
.card-body { padding: 1rem 1.1rem 1.2rem; }
.card-category { font-size: 0.7rem; color: var(--red); font-weight: 700; margin-bottom: 0.35rem; letter-spacing: 0.06em; }
.card-name { font-size: 1.25rem; font-weight: 700; line-height: 1.4; color: var(--dark); font-family: 'Noto Serif KR', serif; }
.card-desc { font-size: 0.8rem; color: var(--mid); margin-top: 0.4rem; line-height: 1.55; }
.card-price-wrap { margin-top: 0.85rem; padding-top: 0.85rem; border-top: 1px solid var(--border); display: flex; align-items: baseline; gap: 0.4rem; }
.card-price-from { font-size: 0.72rem; color: var(--muted); }
.card-price { font-size: 1.2rem; font-weight: 800; color: var(--red); font-family: 'Noto Serif KR', serif; }
.card-price-unit { font-size: 0.78rem; color: var(--mid); }

/* ─── Empty / Loading ─── */
.no-data { text-align: center; padding: 5rem 1rem; color: var(--muted); font-size: 0.9rem; }
.empty-grid { grid-column: 1 / -1; text-align: center; padding: 5rem 1rem; color: var(--muted); }
.empty-grid .icon { font-size: 2.5rem; margin-bottom: 0.8rem; }

/* 탭 스크롤 힌트 화살표 */
.cat-wrap { position: relative; }
.cat-scroll-hint {

/* ─── Lightbox ─── */
.lightbox-overlay {

.lightbox-overlay.open { display: flex; }
.lightbox-content { display: flex; flex-direction: column; gap: 1rem; cursor: default; }
.lightbox-img { max-width: 92vw; object-fit: contain; border-radius: 8px; display: block; }
.lightbox-close {
    position: fixed; top: 1.2rem; right: 1.2rem;

    transition: background 0.2s;

.lightbox-close:hover { background: rgba(255,255,255,0.3); }

/* ─── Mobile ─── */
@media (max-width: 900px) {
    .nav-center { display: none; }
    .hamburger { display: flex; }

@media (max-width: 540px) {

    .event-row:hover { padding-left: 0; padding-right: 0; margin: 0; }

    .event-cards-grid .card-img { aspect-ratio: 3 / 2; }

</style>

function fmt(val) {
    if (!val && val !== 0) return '';
    const s = String(val).trim();
    const n = parseInt(s.replace(/[^0-9]/g, ''));
    if (isNaN(n) || !s.match(/^[\d,]+$/)) return s;
    return n.toLocaleString('ko-KR') + '원';
}
function calcDiscount(orig, sale) {
    const o = parseInt(String(orig).replace(/[^0-9]/g, ''));
    const s = parseInt(String(sale).replace(/[^0-9]/g, ''));
    if (!o || !s || o <= s) return '';
    const pct = Math.round((1 - s / o) * 100);
    return pct > 0 ? pct + '% OFF' : '';
}
function isOn(v) {
    if (!v) return false;
    return ['예','yes','true','1','on'].includes(String(v).toLowerCase().trim());
}

const TAB_TITLES = {
    '이달의 이벤트':  '부천피부과 시술 한의원 | 로아한의원 부천 상동역',
    '리프팅/탄력':   '상동피부과 시술 리프팅 탄력 | 로아한의원 부천',
    '실리프팅':      '상동역피부과 시술 실리프팅 | 로아한의원 부천',
    '윤곽/지방제거': '부천 피부과 윤곽 지방분해 시술 | 로아한의원 상동역',
    '볼륨UP':       '상동 피부과 볼륨 시술 | 로아한의원 부천 상동역',
    '스킨부스터':   '부천 피부과 스킨부스터 피부재생 | 로아한의원 상동역',
    '여드름/흉터':  '부천 피부과 여드름 흉터 치료 | 로아한의원 상동역',
    '다이어트':     '부천 다이어트 한의원 한방다이어트 | 로아한의원 상동역',
};

function setTabTitle(cat) {
    document.title = TAB_TITLES[cat] || '이벤트 | 로아한의원 부천';
}

function selectCat(btn) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    sessionStorage.setItem('eventsTab', currentCat);
    setTabTitle(currentCat);
    render();
}

function openLightbox(srcs, alt) {
    const arr = Array.isArray(srcs) ? srcs : [srcs];
    document.getElementById('lightboxContent').innerHTML =
        arr.map(s => `<img class="lightbox-img" src="${s}" alt="${alt}">`).join('');
    const lb = document.getElementById('lightbox');
    lb.scrollTop = 0;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
}

(function initScrollHint() {
    const wrap = document.getElementById('catWrap');
    const hint = document.getElementById('scrollHint');
    if (!wrap || !hint) return;
    const update = () => {
        const atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4;
        hint.style.opacity = atEnd ? '0' : '1';
        hint.style.pointerEvents = atEnd ? 'none' : 'none';
    };
    wrap.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
})();

function render() {
    const area = document.getElementById('contentArea');

    if (currentCat === '이달의 이벤트') {
        area.innerHTML = '<div class="program-grid event-cards-grid">' +
            EVENT_CARDS.map(it => `
                <a class="program-card" href="program.html?id=${it.id}">
                    <div class="card-img">
                        <img src="${it.img}" alt="${it.name} | 로아한의원 부천">
                    </div>
                    <div class="card-body">
                        <div class="card-name">${it.name}</div>
                        ${it.desc ? `<div class="card-desc">${it.desc}</div>` : ''}
                        <div class="card-price-wrap">
                            <span class="card-price-from">자세히 보기 →</span>
                        </div>
                    </div>
                </a>`).join('') + '</div>';
        return;
    }

    const items = PROGRAMS[currentCat] || [];
    if (!items.length) {
        area.innerHTML = `<div class="program-grid"><div class="empty-grid"><div class="icon">🗓️</div><p>프로그램이 곧 업로드됩니다.</p></div></div>`;
        return;
    }
    area.innerHTML = '<div class="program-grid">' +
        items.map(it => `
            <a class="program-card" href="program.html?id=${it.id}" >
                <div class="card-img">
                    ${it.img
                        ? `<img src="${it.img}" alt="${it.name} | 로아한의원 부천">`
                        : `<div class="card-img-placeholder"><span>📷</span><p>이미지 준비 중</p></div>`
                    }
                </div>
                <div class="card-body">
                    <div class="card-name">${it.name}</div>
                    ${it.desc ? `<div class="card-desc">${it.desc}</div>` : ''}
                    <div class="card-price-wrap">
                        <span class="card-price">${it.price}</span>
                        <span class="card-price-unit">원~</span>
                    </div>
                </div>
            </a>`).join('') + '</div>';
}

async function loadData() {
    try {
        const res = await fetch(FIREBASE_URL + '.json?shallow=false', { signal: AbortSignal.timeout(4000) });
        const raw = await res.json();
        if (raw && raw.events) {
            const d = raw.events;
            eventsData = Array.isArray(d) ? d : Object.values(d);
        } else { eventsData = DEMO_EVENTS; }
    } catch { eventsData = DEMO_EVENTS; }
    render();
}

function toggleMenu() { document.getElementById('mobileMenu').classList.toggle('open'); }
function closeMenu()   { document.getElementById('mobileMenu').classList.remove('open'); }

// 뒤로가기 후 탭 복원
(function restoreTab() {
    const saved = sessionStorage.getItem('eventsTab');
    if (saved && (PROGRAMS[saved] || saved === '이달의 이벤트')) {
        currentCat = saved;
        const btn = document.querySelector(`.cat-tab[data-cat="${saved}"]`);
        if (btn) {
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }
    }
    setTabTitle(currentCat);
})();

loadData();
</script>
